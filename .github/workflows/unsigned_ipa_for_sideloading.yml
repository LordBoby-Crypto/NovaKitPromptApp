name: Build Unsigned IPA Artifact for Windows Sideloading

on:
  workflow_dispatch:

jobs:
  unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -e
          XCODE_PATH=$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)
          if [ -z "$XCODE_PATH" ] && [ -d /Applications/Xcode.app ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          if [ -z "$XCODE_PATH" ]; then
            echo "ERROR: Xcode 26 is required for App Store Connect uploads, but no Xcode app was found."
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -version | grep -E '^Xcode 26(\.|$)' || { echo "ERROR: App Store Connect now requires Xcode 26 / iOS 26 SDK or later."; exit 1; }

      - name: Run core unit tests
        run: swift test

      - name: Build unsigned device app
        run: |
          set -e
          xcodebuild \
            -project NovaKitPromptApp.xcodeproj \
            -scheme NovaKitPromptApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/DerivedData -path "*/Release-iphoneos/*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find built .app"
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry NovaKitPromptApp-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaKitPromptApp-unsigned-IPA
          path: build/NovaKitPromptApp-unsigned.ipa
