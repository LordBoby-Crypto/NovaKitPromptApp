name: Build and Upload to TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode and print diagnostics
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks
          ruby --version
          bundle --version || true

      - name: Install Ruby gems
        run: bundle install

      - name: Preflight - check required GitHub secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          UPLOAD_APP_METADATA: ${{ vars.UPLOAD_APP_METADATA }}
        run: |
          set -e

          missing=0

          check_secret() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "MISSING_SECRET: $name"
              missing=1
            else
              echo "FOUND_SECRET: $name"
            fi
          }

          check_secret "BUILD_CERTIFICATE_BASE64" "$BUILD_CERTIFICATE_BASE64"
          check_secret "P12_PASSWORD" "$P12_PASSWORD"
          check_secret "KEYCHAIN_PASSWORD" "$KEYCHAIN_PASSWORD"
          check_secret "BUILD_PROVISION_PROFILE_BASE64" "$BUILD_PROVISION_PROFILE_BASE64"
          check_secret "ASC_KEY_ID" "$ASC_KEY_ID"
          check_secret "ASC_ISSUER_ID" "$ASC_ISSUER_ID"
          check_secret "ASC_PRIVATE_KEY" "$ASC_PRIVATE_KEY"
          check_secret "APPLE_ID_EMAIL" "$APPLE_ID_EMAIL"
          check_secret "APPLE_TEAM_ID" "$APPLE_TEAM_ID"
          check_secret "APP_STORE_CONNECT_TEAM_ID" "$APP_STORE_CONNECT_TEAM_ID"
          check_secret "BUNDLE_ID" "$BUNDLE_ID"
          check_secret "PROVISIONING_PROFILE_NAME" "$PROVISIONING_PROFILE_NAME"

          if [ "$missing" -ne 0 ]; then
            echo "One or more required GitHub Secrets are missing."
            exit 1
          fi

      - name: Apply Bundle ID, Team ID, and iPhone-only upload settings
        env:
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          project_file = Path("NovaKitPromptApp.xcodeproj/project.pbxproj")

          if not project_file.exists():
              print("ERROR: Could not find NovaKitPromptApp.xcodeproj/project.pbxproj")
              sys.exit(1)

          text = project_file.read_text()

          bundle_id = os.environ["BUNDLE_ID"].strip()
          team_id = os.environ["APPLE_TEAM_ID"].strip()

          def pbx_quote(value: str) -> str:
              value = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{value}"'

          def set_build_setting(text: str, key: str, value: str) -> str:
              pattern = rf'{re.escape(key)} = [^;]+;'
              replacement = f'{key} = {value};'
              if re.search(pattern, text):
                  return re.sub(pattern, replacement, text)
              return text.replace(
                  "SWIFT_VERSION = 5.0;",
                  f"SWIFT_VERSION = 5.0;\n\t\t\t\t{replacement}"
              )

          text = set_build_setting(text, "PRODUCT_BUNDLE_IDENTIFIER", pbx_quote(bundle_id))
          text = set_build_setting(text, "DEVELOPMENT_TEAM", pbx_quote(team_id))

          # Make the app iPhone-only so App Store Connect does not require iPad multitasking orientation support.
          text = set_build_setting(text, "TARGETED_DEVICE_FAMILY", "1")

          # Also mark the app as requiring full screen. This removes the iPad multitasking orientation requirement.
          text = set_build_setting(text, "INFOPLIST_KEY_UIRequiresFullScreen", "YES")

          # Keep all orientations available in generated Info.plist to satisfy validation if the app is ever treated as universal.
          text = set_build_setting(
              text,
              "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone",
              pbx_quote("UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight")
          )

          text = set_build_setting(
              text,
              "INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad",
              pbx_quote("UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight")
          )

          project_file.write_text(text)

          print("Applied Bundle ID, Team ID, iPhone-only target, full-screen setting, and full orientation support.")
          print(f"Bundle ID: {bundle_id}")
          print(f"Team ID: {team_id}")
          PY

      - name: Verify Xcode project can be read
        run: |
          set -e
          xcodebuild -list -project NovaKitPromptApp.xcodeproj

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security default-keychain -s build.keychain

      - name: Install Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          echo "Decoded certificate SHA256:"
          shasum -a 256 certificate.p12

          echo "Testing P12 password with OpenSSL..."
          openssl pkcs12 -info -in certificate.p12 -noout -password pass:"$P12_PASSWORD"

          echo "Importing certificate into temporary keychain..."
          security import certificate.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            build.keychain

          echo "Installed identities:"
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/NovaKitPromptApp.mobileprovision

          echo "Installed provisioning profile:"
          ls -l ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "Provisioning profile details:"
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/NovaKitPromptApp.mobileprovision > decoded_profile.plist
          /usr/libexec/PlistBuddy -c "Print :Name" decoded_profile.plist || true
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" decoded_profile.plist || true

      - name: Print project build settings
        run: |
          set -e
          xcodebuild -project NovaKitPromptApp.xcodeproj -scheme NovaKitPromptApp -showBuildSettings | tee build_settings.txt

      - name: Build and upload with fastlane
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
          UPLOAD_APP_METADATA: ${{ vars.UPLOAD_APP_METADATA }}
        run: |
          set -e
          bundle exec fastlane ios beta

      - name: Upload IPA artifact copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NovaKitPromptApp-TestFlight-IPA
          path: |
            build/*.ipa
            build_settings.txt
          if-no-files-found: ignore
